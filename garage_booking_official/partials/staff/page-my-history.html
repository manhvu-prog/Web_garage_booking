<div class="page" id="page-my-history">
  <div class="page-header">
    <div class="page-title">Lịch sử xe đã phụ trách</div>
    <div class="page-subtitle">Các xe đã xử lý</div>
  </div>
  <div style="margin-bottom:16px">
    <div class="search-box">
      <i class="bi bi-search"></i>
      <input type="text" id="staff-history-search" placeholder="Tìm theo biển số, khách hàng, dịch vụ..." oninput="onStaffHistorySearch(this.value)">
    </div>
  </div>
  <div class="card">
    <div class="card-header"><span class="card-title">Danh sách xe đã phụ trách</span></div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr><th>Biển số</th><th>Khách hàng</th><th>Khung giờ</th><th>Dịch vụ</th><th>Trạng thái</th><th>Ghi chú</th></tr>
        </thead>
        <tbody id="staff-history-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
